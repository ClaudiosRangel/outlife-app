# Codemagic CI/CD — build iOS do OutVitar na nuvem (sem precisar de Mac).
#
# Este pipeline compila o app iOS (Capacitor) num macOS da nuvem do Codemagic
# e envia a build para o TestFlight (beta fechada). O tier gratuito do
# Codemagic oferece 500 minutos/mês de build em macOS M-series — suficiente
# para várias builds de beta.
#
# PRÉ-REQUISITOS no painel do Codemagic (ver docs/GUIA-PUBLICACAO-IOS-APPLE.md):
#   1. Conectar este repositório Git ao Codemagic.
#   2. Integração "App Store Connect" configurada (API key da Apple) — o
#      Codemagic cuida de certificados/perfis via "Automatic code signing".
#   3. Variáveis de ambiente no grupo "appstore" (ver abaixo).
#
# A assinatura (certificados/provisioning) é gerenciada pelo Codemagic via
# App Store Connect API key — você NÃO precisa gerar certificados à mão.

workflows:
  ios-testflight:
    name: OutVitar iOS — TestFlight
    # Máquina macOS na nuvem (grátis no tier free; M-series).
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        # Bundle id do app na Apple. DEVE bater com o App ID criado no
        # Apple Developer e com o appId do capacitor.config.ts.
        BUNDLE_ID: "app.outlife.mobile"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # App Store Connect App ID (número da ficha do app em
        # App Store Connect → App Information → "Apple ID"). Preencher no
        # grupo de variáveis "appstore" do Codemagic.
        APP_STORE_APPLE_ID: $APP_STORE_APPLE_ID
      groups:
        # Grupo de variáveis criado no painel do Codemagic (ver guia).
        - appstore
      # Capacitor 8 exige NodeJS >= 22 (com node 20 o `cap sync ios` aborta
      # com "[fatal] A CLI do Capacitor exige NodeJS >= 22.0.0").
      node: 22
      xcode: latest
      cocoapods: default
      # SEM `ios_signing` automático: a validação de pré-build do signing
      # automático falhava INSTANTANEAMENTE com "No matching profiles" mesmo
      # com certificado + profile salvos e corretos. Em vez disso, baixamos o
      # certificado e o profile via API DENTRO do script (fetch-signing-files),
      # instalamos no keychain e aplicamos — pulando a validação de pré-build.

    # Integração "Apple ASC" — usada para fetch-signing-files (signing) e para
    # o `publishing` (upload ao TestFlight via `auth: integration`).
    integrations:
      app_store_connect: "Apple ASC"

    triggering:
      # Build manual (clicar "Start new build" no painel). Para disparo
      # automático por push, descomentar o bloco events/branch abaixo.
      events: []
      # events:
      #   - push
      # branch_patterns:
      #   - pattern: main
      #     include: true

    scripts:
      - name: Instalar dependências JS
        script: |
          npm ci

      - name: Build web nativo (dist/native-spa)
        script: |
          npm run build:native

      - name: Garantir plataforma iOS e sincronizar Capacitor
        script: |
          # A pasta ios/ já é versionada (CocoaPods). Só recria se faltar,
          # SEMPRE com --packagemanager CocoaPods (o plugin de location só tem
          # .podspec; com SPM o rastreamento ficaria de fora do build).
          if [ ! -d "ios/App" ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
          npx cap sync ios

      - name: Instalar CocoaPods
        script: |
          cd ios/App
          pod install

      - name: DIAGNOSTICO - listar certificados e profiles visiveis
        script: |
          # Passo de diagnóstico: imprime no log tudo que a API Apple enxerga
          # para esta conta (certificados, bundle ids, profiles). Serve para
          # entender por que "No matching profiles". A saída deste passo é o
          # que precisamos ler. (Não falha o build: tudo com || true.)
          echo "===== BUNDLE IDS NA CONTA ====="
          app-store-connect bundle-ids list || true
          echo "===== CERTIFICADOS DE DISTRIBUICAO ====="
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
          echo "===== PROFILES ====="
          app-store-connect profiles list || true
          echo "===== FIM DIAGNOSTICO ====="

      - name: Aplicar certificado + provisioning profile
        script: |
          # O certificado de distribuição e o profile "OutVitar App Store" já
          # EXISTEM na conta Apple (criados manualmente). Aqui, DENTRO do build
          # (sem a validação de pré-build do ios_signing), buscamos esses
          # arquivos via API — SEM --create (eles já existem, só baixar).
          keychain initialize
          # Baixa o certificado de distribuição existente e sua chave.
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --save || true
          # Baixa o provisioning profile de App Store existente para o bundle.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS || true
          # Instala os certificados baixados no keychain e aplica os profiles.
          keychain add-certificates
          xcode-project use-profiles

      - name: Definir número de build incremental
        script: |
          # Usa o número de build do Codemagic como CFBundleVersion, para
          # cada envio ao TestFlight ter um build number único e crescente.
          cd ios/App
          agvtool new-version -all $(($PROJECT_BUILD_NUMBER + 1)) || true

      - name: Compilar e arquivar (.ipa)
        script: |
          # O projeto gerado pelo Capacitor vem SEM DEVELOPMENT_TEAM, e o
          # xcodebuild em CODE_SIGN_STYLE=Manual (configurado pelo use-profiles)
          # exige o team + profile no target, senão: "App requires a
          # provisioning profile". Passamos o DEVELOPMENT_TEAM da conta Apple
          # (Team ID 782BU6WDZ9) e o estilo manual via --archive-flags, direto
          # ao xcodebuild (sem editar o pbxproj).
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="DEVELOPMENT_TEAM=782BU6WDZ9"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Usa a API key da integração "App Store Connect" do Codemagic.
        auth: integration
        # Envia para o TestFlight (beta). NÃO submete para review da App Store
        # automaticamente — você promove manualmente quando quiser.
        submit_to_testflight: true
        # Opcional: distribuir para grupos de teste específicos no TestFlight.
        # beta_groups:
        #   - "Testadores OutVitar"
