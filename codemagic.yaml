# Codemagic CI/CD — build iOS do OutVitar na nuvem (sem precisar de Mac).
#
# Compila o app iOS (Capacitor) num macOS da nuvem do Codemagic e envia para o
# TestFlight (beta). Assinatura via App Store Connect API key (integração
# "Apple ASC"), REUTILIZANDO o certificado de distribuição existente em vez de
# criar um novo a cada build (o que estourava o limite da conta Apple).

workflows:
  ios-testflight:
    name: OutVitar iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # Grupo de variáveis seguras cadastrado no painel do Codemagic
      # (Settings → Environment variables → grupo "appstore"). Contém:
      #   - CERT_PRIVATE_KEY           (chave privada persistente do certificado)
      #   - VITE_SUPABASE_URL          (ex.: https://xxxx.supabase.co)
      #   - VITE_SUPABASE_PUBLISHABLE_KEY
      #   - VITE_SUPABASE_PROJECT_ID
      #   - VITE_MAPBOX_TOKEN          (pk. público do Mapbox)
      #   - VITE_SENTRY_DSN            (opcional)
      # Essas VITE_* precisam existir no ambiente ANTES do `npm run build:native`,
      # pois o Vite as embute no bundle em BUILD TIME. Sem elas, o app abre e
      # mostra "Algo deu errado" (o cliente Supabase lança erro de env ausente).
      groups:
        - appstore
      vars:
        BUNDLE_ID: "app.outlife.mobile"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6819832049"
        TEAM_ID: "782BU6WDZ9"
      # Capacitor 8 exige NodeJS >= 22.
      node: 22
      xcode: latest
      cocoapods: default

    # Integração "Apple ASC" (App Store Connect API key) — usada para a
    # assinatura e o upload.
    integrations:
      app_store_connect: "Apple ASC"

    triggering:
      events: []

    scripts:
      - name: Instalar dependências JS
        script: |
          npm ci

      - name: Build web nativo (dist/native-spa)
        script: |
          # As variáveis VITE_* precisam estar presentes AQUI (build time do
          # Vite). Falha cedo com mensagem clara se faltarem — melhor errar no
          # CI do que entregar um .ipa que abre em "Algo deu errado".
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERRO: VITE_SUPABASE_URL e/ou VITE_SUPABASE_PUBLISHABLE_KEY ausentes."
            echo "Cadastre-as no grupo de variáveis 'appstore' no painel do Codemagic."
            exit 1
          fi
          npm run build:native

      - name: Garantir plataforma iOS e sincronizar Capacitor
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
          npx cap sync ios

      - name: Instalar CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Preparar assinatura (reutiliza certificado existente)
        script: |
          # Inicializa o keychain do build.
          keychain initialize

          # CHAVE PRIVADA PERSISTENTE: para o certificado de distribuição ser
          # REUTILIZÁVEL entre builds (sem criar um novo e estourar o limite da
          # conta), usamos uma chave privada FIXA, salva como variável de
          # ambiente CERT_PRIVATE_KEY no grupo "appstore" (ou geramos uma na
          # primeira vez). Se a env não existir, geramos e seguimos (criará 1
          # certificado nesta build; nas próximas, defina a env para reusar).
          CERT_KEY=/tmp/dist_key.pem
          if [ -n "$CERT_PRIVATE_KEY" ]; then
            echo "$CERT_PRIVATE_KEY" > "$CERT_KEY"
            echo "Usando chave privada persistente da env CERT_PRIVATE_KEY (certificado reutilizado)."
          else
            # Fallback: gera uma chave nova (só se a env não existir). NÃO
            # imprime mais a chave no log por segurança — a chave persistente
            # já está salva na env CERT_PRIVATE_KEY (grupo appstore, Secure).
            ssh-keygen -t rsa -b 2048 -m PEM -f "$CERT_KEY" -q -N ""
            echo "AVISO: CERT_PRIVATE_KEY nao definida; gerada chave efemera (criara 1 certificado novo)."
          fi

          # Busca certificados de distribuição existentes que casem com a chave
          # privada; se não houver nenhum compatível, cria UM (só na 1a vez).
          # fetch-signing-files reutiliza o certificado existente quando a chave
          # privada corresponde — não estoura limite nas próximas builds.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@file:"$CERT_KEY" \
            --create

          # Instala certificados no keychain e aplica os profiles ao projeto.
          keychain add-certificates
          xcode-project use-profiles

      - name: Definir número de build incremental
        script: |
          cd ios/App
          agvtool new-version -all $(($PROJECT_BUILD_NUMBER + 1)) || true

      - name: Compilar e arquivar (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Publicar no TestFlight
        script: |
          # Upload passando Apple ID + asc-provider ao altool (bug Xcode 26
          # multi-provider: altool não acha o app pelo bundle sem o provider).
          APP_IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Enviando $APP_IPA para o App Store Connect..."
          app-store-connect publish \
            --path "$APP_IPA" \
            --testflight \
            --altool-additional-arguments="--apple-id 6819832049 --asc-provider 782BU6WDZ9"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
